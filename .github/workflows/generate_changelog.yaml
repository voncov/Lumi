name: Generate Changelog

on:
  push:
    branches:
      - main  

jobs:
  build:
    runs-on: ubuntu-latest  

    steps:
    - uses: actions/checkout@v2  
      with:
        fetch-depth: 0  
   
    - name: Download and Install git-cliff
      run: |  
        curl -L "https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz" -o git-cliff.tar.gz
        tar -xzf git-cliff.tar.gz
        mv git-cliff-2.14.2/git-cliff /usr/local/bin/
    - name: Generate Changelog
      run: git-cliff --config cliff.toml --output CHANGELOG.md  
     
    - name: Commit Changelog
      run: |  
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        git add CHANGELOG.md
        
        if [ -n "$(git status --porcelain CHANGELOG.md)" ]; then
          git commit -m "chore: Update CHANGELOG.md"
          git push https://github.com/${{ github.repository }}.git HEAD:main
        else
          echo "Изменений в CHANGELOG.md нет. Коммит пропущен."
        fi